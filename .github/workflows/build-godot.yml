name: Build Godot APK

# Taruh file ini di repo worker: .github/workflows/build-godot.yml
# Lalu isi "workflows": { "godot": "build-godot.yml" } di githubworkers.json.
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job ID"
        required: true
      userId:
        description: "User ID"
        required: false
        default: "0"
      payload:
        description: "JSON payload dari bot"
        required: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baca payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          echo "$PAYLOAD" > payload.json
          cat payload.json
          ZIP_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
          [ -n "$ZIP_URL" ] || { echo "::error::Tidak ada url di payload"; exit 1; }
          echo "ZIP_URL=$ZIP_URL" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$(jq -r '.buildType // "release"' payload.json)" >> "$GITHUB_ENV"

      - name: Download & ekstrak ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip && mkdir -p project_raw
          if [[ "$ZIP_URL" == *"api.github.com"* ]]; then
            curl -fL --retry 3 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o project.zip "$ZIP_URL"
          else
            curl -fL --retry 3 --retry-delay 5 -o project.zip "$ZIP_URL"
          fi
          unzip -q project.zip -d project_raw
          GFILE=$(find project_raw -maxdepth 5 -name project.godot -not -path "*/addons/*" | head -n1 || true)
          [ -n "$GFILE" ] || { echo "::error::project.godot tidak ditemukan di ZIP"; find project_raw -maxdepth 3; exit 1; }
          echo "PROJ=$(dirname "$GFILE")" >> "$GITHUB_ENV"
          echo "Project Godot: $(dirname "$GFILE")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Godot + export template
        run: |
          set -euo pipefail
          GV="$GODOT_VERSION"
          mkdir -p /tmp/godot_bin /tmp/godot_tpl "$HOME/.local/share/godot/export_templates/${GV}.stable"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot_bin
          GODOT_BIN=$(find /tmp/godot_bin -type f -name 'Godot_v*' | head -n1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/godot_tpl.tpz "https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          unzip -q -o /tmp/godot_tpl.tpz -d /tmp/godot_tpl
          cp -r /tmp/godot_tpl/templates/* "$HOME/.local/share/godot/export_templates/${GV}.stable/"
          "$GODOT_BIN" --version || true

      - name: Siapkan Android SDK, keystore, editor settings
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          "$SDKM" "cmake;3.10.2.4988404" "ndk;23.2.8568313" >/dev/null 2>&1 || true
          KS="$HOME/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 >/dev/null 2>&1 || true
          mkdir -p "$HOME/.config/godot"
          for f in "editor_settings-4.tres" "editor_settings-${GODOT_VERSION}.tres"; do
            cat > "$HOME/.config/godot/$f" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done

      - name: Preset export Android (otomatis jika belum ada)
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          if grep -q 'platform="Android"' export_presets.cfg 2>/dev/null; then
            echo "Preset Android sudah ada, dipakai apa adanya."; exit 0
          fi
          [ -f export_presets.cfg ] && mv export_presets.cfg export_presets.cfg.bak || true
          GNAME=$(grep -m1 '^config/name=' project.godot | sed -E 's/^config\/name="(.*)"/\1/' || true)
          [ -n "$GNAME" ] || GNAME="Godot Game"
          SLUG=$(echo "$GNAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          [ -n "$SLUG" ] || SLUG="game"
          case "$SLUG" in [0-9]*) SLUG="g$SLUG" ;; esac
          printf '%s\n' \
            '[preset.0]' '' 'name="Android"' 'platform="Android"' 'runnable=true' 'dedicated_server=false' 'custom_features=""' \
            'export_filter="all_resources"' 'include_filter=""' 'exclude_filter=""' 'export_path="build/game.apk"' \
            'encryption_include_filters=""' 'encryption_exclude_filters=""' 'encrypt_pck=false' 'encrypt_directory=false' '' \
            '[preset.0.options]' '' 'custom_template/debug=""' 'custom_template/release=""' \
            'gradle_build/use_gradle_build=false' 'gradle_build/export_format=0' 'gradle_build/min_sdk=""' 'gradle_build/target_sdk=""' \
            'architectures/armeabi-v7a=false' 'architectures/arm64-v8a=true' 'architectures/x86=false' 'architectures/x86_64=false' \
            'version/code=1' 'version/name="1.0.0"' "package/unique_name=\"com.godotapp.${SLUG}\"" "package/name=\"${GNAME}\"" \
            'package/signed=true' 'package/app_category=2' 'screen/immersive_mode=true' \
            'screen/support_small=true' 'screen/support_normal=true' 'screen/support_large=true' 'screen/support_xlarge=true' \
            > export_presets.cfg

      - name: Export APK
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          mkdir -p build
          run_godot() {
            "$GODOT_BIN" --headless --import >/dev/null 2>&1 || true
            rm -f build/game.apk
            "$GODOT_BIN" --headless --export-debug "Android" build/game.apk
          }
          run_godot || { echo "Export gagal, ulang sekali..."; rm -rf .godot; run_godot || true; }
          [ -s build/game.apk ] || { echo "::error::APK Godot tidak terbentuk"; exit 1; }
          ls -lh build/game.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/game.apk "$GITHUB_WORKSPACE/out/app-${BUILD_TYPE}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: out/*.apk
          retention-days: 1
          
